<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#f5f2eb" />
    <title>Page not found | Calvin Hickey</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <script src="js/theme-init.js"></script>
    <link rel="stylesheet" href="css/styles.css" />
    <script type="module" src="js/main.js"></script>
  </head>
  <body>
    <main class="container not-found" id="main">
      <span class="hero-tag" aria-hidden="true">404</span>
      <p class="eyebrow">Error 404</p>
      <h1>Missed the <em>beat</em>.</h1>
      <p class="hero-intro">
        There’s nothing at this address. It may have moved, or the link might have a typo.
      </p>
      <div class="hero-actions">
        <a class="button" href="./">Back to the homepage</a>
        <button class="theme-toggle" type="button" aria-pressed="false" data-theme-toggle>
          <svg class="icon when-light" aria-hidden="true">
            <use href="img/icons.svg#moon"></use>
          </svg>
          <svg class="icon when-dark" aria-hidden="true"><use href="img/icons.svg#sun"></use></svg>
          <span class="visually-hidden">Dark mode</span>
          <span class="when-light" aria-hidden="true">Lights off</span>
          <span class="when-dark" aria-hidden="true">Lights on</span>
        </button>
      </div>
    </main>
  </body>
</html>
